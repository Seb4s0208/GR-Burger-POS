
name: Generar APK GR Burger POS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q GR_Burger_POS_Proyecto_v2.zip -d source

      - name: Compilar APK
        run: |
          cd source
          gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GR-Burger-POS-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
