
name: Generar APK GR Burger POS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q GR_Burger_POS_Proyecto_v2.zip -d source

      
      - name: Corregir Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"
          replacement = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""
          if marker not in s:
              raise SystemExit("No se encontró la configuración esperada")
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Compilar APK
        run: |
          cd source
          gradle --no-daemon :app:assembleDebug


      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GR-Burger-POS-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
